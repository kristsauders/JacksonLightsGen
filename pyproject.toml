[project]
name = "xlights-mcp-server"
version = "0.1.0"
description = "MCP server for generating xLights sequences from music analysis"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0.0",
    "librosa>=0.10.0",
    "numpy>=1.24.0,<2.0.0",
    "pyloudnorm>=0.1.1",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "lxml>=5.0.0",
    "soundfile>=0.12.0",
]

[project.optional-dependencies]
separation = [
    "demucs>=4.1.0",
    "torch>=2.1,<2.3",
    "torchaudio>=2.1,<2.3",
]
beats = [
    "madmom>=0.16.1",
    "setuptools<81",  # madmom imports pkg_resources, removed from setuptools in v81+
]
lyrics = [
    "openai-whisper>=20230918",
    "torch>=2.1,<2.3",
    "numba>=0.59",
]
all = [
    "xlights-mcp-server[separation,beats,lyrics]",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[tool.uv.extra-build-dependencies]
madmom = ["Cython", "setuptools", "numpy"]

[tool.uv.sources]
# PyPI release (0.16.1, 2018) doesn't import on Python >=3.10 (uses the
# removed `collections.MutableSequence` alias). Git main has the fix.
madmom = { git = "https://github.com/CPJKU/madmom.git" }

[project.scripts]
xlights-mcp-server = "xlights_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xlights_mcp"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
